name: Restaurant Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'Session7/restaurant-service/**'

jobs:
  build_job:
    # KHÚC QUAN TRỌNG: Gọi đích danh runner thông qua nhãn (label) đã định nghĩa ở Compose
    runs-on: [self-hosted, quickbite-runner]
    
    defaults:
      run:
        working-directory: ./Session7/restaurant-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Jar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-service-artifact
          path: Session7/restaurant-service/build/libs/*.jar
          retention-days: 3