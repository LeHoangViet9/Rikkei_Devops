version: '3.8'

services:
  backend:
    restart: always
    environment:
      - ENV=production
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    restart: always
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password # Khuyến nghị bảo mật môi trường Prod